name: Release

# Cut a release either way:
#   git tag v1.2.3 && git push origin v1.2.3
#   or run this workflow from main and type 1.2.3 (it creates the tag)
# Then: the full CI/CD pipeline on that commit -> versioned images on Docker Hub
# -> the GitHub Release with generated notes -> Deploy Production, which waits
# for approval on the `production` environment. Pre-releases (1.2.3-rc.1) are
# published but never deployed. Setup: docs/DEPLOYMENT.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.3 (tags the current main as v1.2.3)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run releases from main."
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$tag\" isn't a version like v1.2.3."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag must point at a commit on main."
            exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA (pre-release: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  pipeline:
    name: Pipeline
    needs: prepare
    uses: ./.github/workflows/ci-cd.yaml

  images:
    name: Images
    needs: [prepare, pipeline]
    # Skipped (not failed) until Docker Hub is set up.
    if: vars.DOCKERHUB_USERNAME != ''
    uses: ./.github/workflows/docker-publish.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    name: GitHub Release
    needs: [prepare, pipeline, images]
    if: ${{ !cancelled() && needs.pipeline.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IMAGES_PUBLISHED: ${{ needs.images.result == 'success' }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
        run: |
          args=(--title "PlanStride $TAG" --generate-notes)
          if [ "$EVENT" = push ]; then
            args+=(--verify-tag)
          else
            # Tag exactly the commit the pipeline just checked.
            args+=(--target "$GITHUB_SHA")
          fi
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          if [ "$IMAGES_PUBLISHED" = true ]; then
            notes=$'## Docker images\n\n```sh\n'
            for image in api app internal site; do
              notes+="docker pull docker.io/$NAMESPACE/planstride-$image:$VERSION"$'\n'
            done
            notes+='```'
            args+=(--notes "$notes")
          fi
          gh release create "$TAG" "${args[@]}"
          echo "Published the [$TAG release]($(gh release view "$TAG" --json url --jq .url))." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [prepare, release]
    # Stable releases only, and only once Vercel is set up.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.prepare.outputs.prerelease == 'false' && vars.VERCEL_ORG_ID != '' }}
    uses: ./.github/workflows/deploy-production.yaml
    with:
      version: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
