name: Frontend Build

on:
  pull_request:
    paths:
      - "app/**"
      - "internal/**"
      - "site/**"
      - ".github/workflows/frontend-build.yaml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "internal/**"
      - "site/**"
      - ".github/workflows/frontend-build.yaml"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [app, internal, site]
    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.package }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint and format check
        run: npm run validate

      - name: Build
        # Public build config (API and site URLs) comes from the committed .env.production.
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-build
          path: ${{ matrix.package }}/dist/client/
          retention-days: 7
