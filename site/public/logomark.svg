<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PlanStride">
  <!--
    PlanStride logomark: "two strides".
    A check mark split where it bends: a short mint step (the sub-goals) and a
    long white stride (the one thing that ships by Friday). The green tile keeps
    it legible at 16px on light and dark browser tabs alike.
    Green #059669 / Mint #A7F3D0 / White.
  -->
  <rect width="64" height="64" rx="15" fill="#059669"/><path d="M13.5 31 20 37.5" stroke="#A7F3D0" stroke-width="9" stroke-linecap="round"/><path d="M29.5 45.5 49.5 19" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
</svg>
